name: Build One Naeem Music APK

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Build exactly one APK edition"
        required: true
        type: choice
        default: foss
        options:
          - foss
          - full

permissions:
  contents: read

jobs:
  build-one-apk:
    name: Build one ${{ inputs.edition }} arm64 APK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: microsoft
          cache: gradle

      - name: Configure selected edition and secrets
        env:
          EDITION: ${{ inputs.edition }}
          BASE_64_SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$BASE_64_SIGNING_KEY" ]; then
            echo "Missing BASE_64_SIGNING_KEY repository secret"
            exit 1
          fi
          echo "$BASE_64_SIGNING_KEY" | base64 -d > simpmusic.jks
          if [ "$EDITION" = "full" ]; then
            echo "isFullBuild=true" >> ./gradle.properties
          else
            echo "isFullBuild=false" >> ./gradle.properties
          fi
          {
            echo "LASTFM_API_KEY=$LASTFM_API_KEY"
            echo "LASTFM_SECRET=$LASTFM_SECRET"
            echo "SENTRY_DSN=$SENTRY_DSN"
            echo "SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN"
          } > ./local.properties

      - name: Generate library metadata
        run: ./gradlew exportLibraryDefinitions

      - name: Build, align and sign one APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$EDITION" = "full" ]; then
            ./build_and_sign_apk.sh --release --full
          else
            ./build_and_sign_apk.sh --release --foss
          fi

      - name: Verify exactly one signed APK
        run: |
          mapfile -t APKS < <(find androidApp/build/outputs/apk/release -maxdepth 1 -type f -name "SimpMusic-*.apk")
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one signed APK, found ${#APKS[@]}"
            printf '%s\n' "${APKS[@]}"
            exit 1
          fi
          cp "${APKS[0]}" "./NaeemMusic-${{ inputs.edition }}-arm64.apk"

      - name: Upload only the signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NaeemMusic-${{ inputs.edition }}-arm64
          path: NaeemMusic-${{ inputs.edition }}-arm64.apk
          if-no-files-found: error
