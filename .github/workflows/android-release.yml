name: Build One Naeem Music APK

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Choose exactly one APK edition"
        required: true
        type: choice
        default: foss
        options:
          - foss
          - full

permissions:
  contents: read

jobs:
  build-one-apk:
    name: Build one ${{ inputs.edition }} arm64 APK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: microsoft
          cache: gradle

      - name: Configure selected edition
        env:
          EDITION: ${{ inputs.edition }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ "$EDITION" = "full" ]; then
            echo "isFullBuild=true" >> ./gradle.properties
          else
            echo "isFullBuild=false" >> ./gradle.properties
          fi
          {
            echo "LASTFM_API_KEY=$LASTFM_API_KEY"
            echo "LASTFM_SECRET=$LASTFM_SECRET"
            echo "SENTRY_DSN=$SENTRY_DSN"
            echo "SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN"
          } > ./local.properties

      - name: Generate library metadata
        run: ./gradlew exportLibraryDefinitions

      - name: Build exactly one APK
        run: ./gradlew androidApp:assembleRelease

      - name: Verify single APK output
        id: apk
        run: |
          mapfile -t APKS < <(find androidApp/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk")
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one APK, found ${#APKS[@]}"
            printf '%s\n' "${APKS[@]}"
            exit 1
          fi
          cp "${APKS[0]}" "./NaeemMusic-${{ inputs.edition }}-arm64.apk"
          echo "path=NaeemMusic-${{ inputs.edition }}-arm64.apk" >> "$GITHUB_OUTPUT"

      - name: Upload only the APK
        uses: actions/upload-artifact@v4
        with:
          name: NaeemMusic-${{ inputs.edition }}-arm64
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
