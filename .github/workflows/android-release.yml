name: Build APK for Release (Full & FOSS)

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'dev'
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: FULL RELEASE BUILD
  # ==========================================
  build-full-release:
    name: Build full release version
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Setup Last.fm Secrets
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> ./local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> ./local.properties

      - name: Decode Keystore File
        env:
          BASE_64_SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
        run: |
          echo "$BASE_64_SIGNING_KEY" | base64 -d > simpmusic.jks

      - name: Enable Full Build Flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Build Full Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./build_and_sign_apk.sh --release --full

      - name: Rename Output APK to NaeemMusic.apk
        run: |
          find androidApp/build/outputs/apk/release/ -name "*.apk" -exec mv {} androidApp/build/outputs/apk/release/NaeemMusic.apk \;

      - name: Upload Full Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NaeemMusic-Full-Release
          path: androidApp/build/outputs/apk/release/NaeemMusic.apk


  # ==========================================
  # JOB 2: FOSS RELEASE BUILD
  # ==========================================
  build-foss-release:
    name: Build foss release version
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Decode Keystore File
        env:
          BASE_64_SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
        run: |
          echo "$BASE_64_SIGNING_KEY" | base64 -d > simpmusic.jks

      - name: Enable FOSS Build Flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=false" >> ./gradle.properties

      - name: Build FOSS Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./build_and_sign_apk.sh --release --foss

      - name: Rename Output APK to NaeemMusic.apk
        run: |
          find androidApp/build/outputs/apk/release/ -name "*.apk" -exec mv {} androidApp/build/outputs/apk/release/NaeemMusic.apk \;

      - name: Upload FOSS Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NaeemMusic-FOSS-Release
          path: androidApp/build/outputs/apk/release/NaeemMusic.apk
